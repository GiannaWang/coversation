name: Build macOS app

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - mac-package

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app
        run: chmod +x build_mac.sh && ./build_mac.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: TextConverter-macOS
          path: release/TextConverter-macOS.zip
          if-no-files-found: error

      - name: Publish downloadable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view macos-latest >/dev/null 2>&1; then
            gh release upload macos-latest release/TextConverter-macOS.zip --clobber
          else
            gh release create macos-latest release/TextConverter-macOS.zip \
              --target "$GITHUB_SHA" \
              --title "TextConverter macOS" \
              --notes "Automatically built macOS application package."
          fi
